name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas de API
        run: npm run test:assessment-api
      - name: Pruebas de herramientas del agente
        run: npm run test:agent
      - name: Build
        run: npm run build
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Recorrido de navegador
        run: npm run test:e2e
      - name: Guardar evidencia del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
